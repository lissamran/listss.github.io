<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tier List Creator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --tier-sss: #FF2D55;
    --tier-ss:  #FF6B00;
    --tier-s:   #FFCC00;
    --tier-ap:  #9DFF3E;
    --tier-a:   #3ECEFF;
    --tier-b:   #9B59FF;
    --bg:       #0A0A0F;
    --surface:  #13131C;
    --card:     #1C1C2A;
    --border:   rgba(255,255,255,0.08);
    --text:     #E8E8F0;
    --muted:    rgba(255,255,255,0.35);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding-bottom: 48px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #FF2D55, #FF6B00, #FFCC00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  header p {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 14px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── POOL ── */
  .pool-drop {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 88px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 24px;
    transition: background 0.15s, border-color 0.15s;
    align-items: flex-start;
    align-content: flex-start;
  }

  .pool-drop.drag-over {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.25);
  }

  .pool-empty {
    color: var(--muted);
    font-size: 13px;
    align-self: center;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }

  /* ── TIERS ── */
  .tiers-wrapper {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .tier-row {
    display: flex;
    min-height: 80px;
    border-bottom: 1px solid var(--border);
  }
  .tier-row:last-child { border-bottom: none; }

  .tier-label {
    width: 70px;
    min-width: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    position: relative;
    flex-shrink: 0;
  }

  .tier-label::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }

  .tier-row[data-tier="SSS"] .tier-label { color: var(--tier-sss); background: rgba(255,45,85,0.09); }
  .tier-row[data-tier="SS"]  .tier-label { color: var(--tier-ss);  background: rgba(255,107,0,0.09); }
  .tier-row[data-tier="S"]   .tier-label { color: var(--tier-s);   background: rgba(255,204,0,0.09); }
  .tier-row[data-tier="A+"]  .tier-label { color: var(--tier-ap);  background: rgba(157,255,62,0.09); }
  .tier-row[data-tier="A"]   .tier-label { color: var(--tier-a);   background: rgba(62,206,255,0.09); }
  .tier-row[data-tier="B"]   .tier-label { color: var(--tier-b);   background: rgba(155,89,255,0.09); }

  .tier-drop {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    align-content: center;
    padding: 8px 10px;
    gap: 6px;
    min-height: 80px;
    transition: background 0.15s;
  }

  .tier-drop.drag-over { background: rgba(255,255,255,0.04); }

  /* ── DROP PLACEHOLDER (insert indicator) ── */
  .drop-placeholder {
    width: 4px;
    min-width: 4px;
    height: 64px;
    background: #FFCC00;
    border-radius: 3px;
    box-shadow: 0 0 10px #FFCC00, 0 0 4px #FFCC00;
    flex-shrink: 0;
    pointer-events: none;
  }

  /* ── CHARACTER CARDS ── */
  .char-card {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    overflow: hidden;
    cursor: grab;
    position: relative;
    border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s, opacity 0.12s;
    flex-shrink: 0;
    user-select: none;
    background: var(--card);
    -webkit-user-select: none;
  }

  .char-card:hover {
    transform: scale(1.08);
    border-color: rgba(255,255,255,0.3);
    z-index: 10;
  }

  .char-card.dragging {
    opacity: 0.25;
    cursor: grabbing;
    transform: scale(0.95);
  }

  .char-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .char-card .char-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.78);
    color: #fff;
    font-size: 8.5px;
    font-weight: 700;
    text-align: center;
    padding: 2px 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  .char-card .delete-btn {
    position: absolute;
    top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: rgba(220,30,60,0.92);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 10px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    z-index: 20;
  }

  .char-card:hover .delete-btn { display: flex; }

  @media (hover: none) {
    .char-card .delete-btn { display: flex; width: 16px; height: 16px; font-size: 9px; top: 1px; right: 1px; }
  }

  /* ── TOUCH GHOST ── */
  #touchGhost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 68px; height: 68px;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    border: 2.5px solid rgba(255,255,255,0.6);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    transform: scale(1.12);
    transform-origin: center center;
  }

  #touchGhost img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── ACTIONS ── */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 11px 20px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    min-height: 44px;
    flex: 1;
    min-width: 120px;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover   { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.3); }
  .btn:active  { transform: scale(0.96); }

  .btn-add     { border-color: rgba(255,255,255,0.2); }
  .btn-primary { border-color: rgba(255,204,0,0.5); color: #FFCC00; }
  .btn-primary:hover { background: rgba(255,204,0,0.1); }
  .btn-danger  { border-color: rgba(255,45,85,0.4); color: #FF2D55; }
  .btn-danger:hover  { background: rgba(255,45,85,0.1); }

  /* ── MODAL ── */
  .name-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .name-overlay.active { display: flex; }

  .name-modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 24px 20px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }

  .name-modal h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  .name-modal img {
    width: 76px; height: 76px;
    object-fit: cover;
    border-radius: 8px;
    margin: 0 auto 14px;
    display: block;
    border: 2px solid var(--border);
  }

  .name-modal input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    padding: 11px 14px;
    margin-bottom: 16px;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  .name-modal input:focus { border-color: rgba(255,204,0,0.6); }

  .name-modal .modal-btns { display: flex; gap: 10px; }
  .name-modal .modal-btns .btn { font-size: 12px; padding: 10px 14px; }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    header { padding: 14px 14px 10px; }
    header h1 { font-size: 34px; }
    .main { padding: 14px 10px; }
    .tier-label { width: 52px; min-width: 52px; font-size: 22px; }
    .char-card { width: 58px; height: 58px; }
    .drop-placeholder { height: 58px; }
    .tier-drop { padding: 6px 8px; gap: 5px; min-height: 72px; }
    .tier-row { min-height: 72px; }
    .pool-drop { gap: 6px; padding: 8px; }
    .btn { font-size: 11px; padding: 10px 12px; min-width: 90px; }
  }
</style>
</head>
<body>

<header>
  <h1>TIER LIST</h1>
  <p>Arrastra personajes · Inserta en cualquier posición</p>
</header>

<div class="main">

  <div class="section-title">Personajes</div>
  <div class="pool-drop" id="characterPool">
    <p class="pool-empty" id="poolEmpty">Toca "+ Agregar personajes" para comenzar</p>
  </div>

  <div class="section-title" style="margin-bottom:10px;">Tier List</div>
  <div class="tiers-wrapper" id="tierContainer">
    <div class="tier-row" data-tier="SSS">
      <div class="tier-label">SSS</div>
      <div class="tier-drop" data-tier="SSS"></div>
    </div>
    <div class="tier-row" data-tier="SS">
      <div class="tier-label">SS</div>
      <div class="tier-drop" data-tier="SS"></div>
    </div>
    <div class="tier-row" data-tier="S">
      <div class="tier-label">S</div>
      <div class="tier-drop" data-tier="S"></div>
    </div>
    <div class="tier-row" data-tier="A+">
      <div class="tier-label">A+</div>
      <div class="tier-drop" data-tier="A+"></div>
    </div>
    <div class="tier-row" data-tier="A">
      <div class="tier-label">A</div>
      <div class="tier-drop" data-tier="A"></div>
    </div>
    <div class="tier-row" data-tier="B">
      <div class="tier-label">B</div>
      <div class="tier-drop" data-tier="B"></div>
    </div>
  </div>

  <div class="actions">
    <label class="btn btn-add">
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      + Agregar personajes
    </label>
    <button class="btn btn-primary" onclick="exportImage()">⬇ Exportar</button>
    <button class="btn btn-danger"  onclick="clearAll()">✕ Limpiar</button>
  </div>

</div>

<div class="name-overlay" id="nameOverlay">
  <div class="name-modal">
    <h3>Nombre del personaje</h3>
    <img id="modalPreview" src="" alt="">
    <input type="text" id="nameInput" placeholder="Ej: Goku, Naruto..." maxlength="20">
    <div class="modal-btns">
      <button class="btn" onclick="cancelUpload()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmName()">Agregar ✓</button>
    </div>
  </div>
</div>

<div id="touchGhost"><img id="ghostImg" src="" alt=""></div>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const pool        = document.getElementById('characterPool');
const poolEmpty   = document.getElementById('poolEmpty');
const fileInput   = document.getElementById('fileInput');
const nameOverlay = document.getElementById('nameOverlay');
const nameInput   = document.getElementById('nameInput');
const modalPreview= document.getElementById('modalPreview');
const touchGhost  = document.getElementById('touchGhost');
const ghostImg    = document.getElementById('ghostImg');

const placeholder = document.createElement('div');
placeholder.className = 'drop-placeholder';

let mouseDragging = null;   
let touchCard     = null;   
let touchDragging = false;  
let touchStartX   = 0;
let touchStartY   = 0;
const DRAG_THRESHOLD = 8;  

let pendingData   = [];
let modalQueue    = [];
let currentModal  = 0;
let lastTargetZone = null; // Guarda la última zona válida donde estuvo el touch

// ─────────────────────────────────────────────
//  FILE UPLOAD
// ─────────────────────────────────────────────
fileInput.addEventListener('change', e => {
  processFiles(Array.from(e.target.files));
  fileInput.value = '';
});

function processFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  pendingData = [];
  let loaded = 0;
  imgs.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      pendingData.push({ src: ev.target.result, name: file.name.replace(/\.[^/.]+$/, '') });
      if (++loaded === imgs.length) {
        modalQueue  = [...pendingData];
        currentModal = 0;
        showNextModal();
      }
    };
    reader.readAsDataURL(file);
  });
}

function showNextModal() {
  if (currentModal >= modalQueue.length) { nameOverlay.classList.remove('active'); return; }
  const item = modalQueue[currentModal];
  modalPreview.src  = item.src;
  nameInput.value   = item.name;
  nameOverlay.classList.add('active');
  setTimeout(() => nameInput.select(), 60);
}

nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });

function confirmName() {
  const item  = modalQueue[currentModal];
  item.name   = nameInput.value.trim() || 'Personaje';
  addCharacter(item.src, item.name);
  currentModal++;
  showNextModal();
}

function cancelUpload() { currentModal++; showNextModal(); }

function addCharacter(src, name) {
  poolEmpty.style.display = 'none';
  pool.appendChild(createCard(src, name));
}

// ─────────────────────────────────────────────
//  CARD FACTORY
// ─────────────────────────────────────────────
function createCard(src, name) {
  const card = document.createElement('div');
  card.className   = 'char-card';
  card.draggable   = true;
  card.dataset.src = src;
  card.dataset.name = name;

  const img = document.createElement('img');
  img.src = src; img.alt = name;
  img.draggable = false; 

  const label = document.createElement('div');
  label.className = 'char-name';
  label.textContent = name;

  const del = document.createElement('button');
  del.className = 'delete-btn';
  del.innerHTML = '✕';
  del.addEventListener('click', e => {
    e.stopPropagation();
    card.remove();
    checkPoolEmpty();
  });

  card.appendChild(img);
  card.appendChild(label);
  card.appendChild(del);

  setupMouseDrag(card);
  return card;
}

function checkPoolEmpty() {
  poolEmpty.style.display = pool.querySelector('.char-card') ? 'none' : '';
}

function removePlaceholder() {
  if (placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
}

// NUEVO ALGORITMO: Calcula de manera mucho más precisa si estás antes o después
function getInsertBefore(zone, cx, cy) {
  const cards = [...zone.querySelectorAll('.char-card:not(.dragging)')];
  if (cards.length === 0) return null;

  for (let card of cards) {
    const r = card.getBoundingClientRect();
    // Verificamos si el cursor se encuentra dentro de la fila vertical de la tarjeta
    if (cy >= r.top && cy <= r.bottom) {
      // Si está a la izquierda de la mitad del ancho de la tarjeta, va ANTES
      if (cx < r.left + r.width / 2) {
        return card;
      }
    } else if (cy < r.top) {
      // Si el cursor está completamente por encima de esta tarjeta en una fila superior
      return card;
    }
  }
  return null;
}

// ─────────────────────────────────────────────
//  MOUSE DRAG (Escritorio)
// ─────────────────────────────────────────────
function setupMouseDrag(card) {
  card.addEventListener('dragstart', e => {
    mouseDragging = card;
    e.dataTransfer.effectAllowed = 'move';
    const blank = document.createElement('canvas');
    blank.width = blank.height = 1;
    e.dataTransfer.setDragImage(blank, 0, 0);
    setTimeout(() => card.classList.add('dragging'), 0);
  });

  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    mouseDragging = null;
    removePlaceholder();
    document.querySelectorAll('.drag-over').forEach(z => z.classList.remove('drag-over'));
    checkPoolEmpty();
  });
}

function bindDropZone(zone) {
  zone.addEventListener('dragover', e => {
    e.preventDefault();
    if (!mouseDragging) return;
    zone.classList.add('drag-over');
    const before = getInsertBefore(zone, e.clientX, e.clientY);
    before ? zone.insertBefore(placeholder, before) : zone.appendChild(placeholder);
  });

  zone.addEventListener('dragleave', e => {
    if (!zone.contains(e.relatedTarget)) {
      zone.classList.remove('drag-over');
      if (placeholder.parentNode === zone) removePlaceholder();
    }
  });

  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (!mouseDragging) return;
    if (placeholder.parentNode === zone) {
      zone.insertBefore(mouseDragging, placeholder);
    } else {
      zone.appendChild(mouseDragging);
    }
    removePlaceholder();
    checkPoolEmpty();
  });
}

bindDropZone(pool);
document.querySelectorAll('.tier-drop').forEach(bindDropZone);

// ─────────────────────────────────────────────
//  TOUCH DRAG TRATADO Y CORREGIDO (Móviles)
// ─────────────────────────────────────────────
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.char-card');
  if (!card || e.target.closest('.delete-btn')) return;

  touchCard     = card;
  touchDragging = false;
  lastTargetZone = null; 
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!touchCard) return;
  const t = e.touches[0];

  if (!touchDragging) {
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;

    touchDragging = true;
    touchCard.classList.add('dragging');
    ghostImg.src = touchCard.dataset.src;
    touchGhost.style.display = 'block';
    if (navigator.vibrate) navigator.vibrate(15);
  }

  e.preventDefault(); // Evita scroll

  // Mueve el clon flotante
  touchGhost.style.left = (t.clientX - 34) + 'px';
  touchGhost.style.top  = (t.clientY - 45) + 'px'; 

  // Escaneo debajo del dedo de manera segura
  touchGhost.style.visibility = 'hidden';
  const el = document.elementFromPoint(t.clientX, t.clientY);
  touchGhost.style.visibility = 'visible';

  const zone = el && (el.closest('.tier-drop') || el.closest('#characterPool'));

  document.querySelectorAll('.drag-over').forEach(z => z.classList.remove('drag-over'));

  if (zone) {
    lastTargetZone = zone; // Guardamos la zona para asegurar el drop final
    zone.classList.add('drag-over');
    const before = getInsertBefore(zone, t.clientX, t.clientY);
    if (before) {
      zone.insertBefore(placeholder, before);
    } else {
      zone.appendChild(placeholder);
    }
  } else {
    // Si sale de una zona a un espacio vacío intermedio, removemos temporalmente el placeholder
    removePlaceholder();
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!touchCard) return;

  touchGhost.style.display = 'none';
  touchCard.classList.remove('dragging');

  if (touchDragging) {
    // CORRECCIÓN CLAVE: Si el placeholder existe insertamos ahí, si no, usamos la última zona detectada.
    if (placeholder.parentNode) {
      placeholder.parentNode.insertBefore(touchCard, placeholder);
    } else if (lastTargetZone) {
      lastTargetZone.appendChild(touchCard);
    }
    
    removePlaceholder();
    document.querySelectorAll('.drag-over').forEach(z => z.classList.remove('drag-over'));
    checkPoolEmpty();
  }

  touchCard      = null;
  touchDragging = false;
  lastTargetZone = null;
}, { passive: true });

document.addEventListener('touchcancel', () => {
  if (!touchCard) return;
  touchGhost.style.display = 'none';
  touchCard.classList.remove('dragging');
  removePlaceholder();
  document.querySelectorAll('.drag-over').forEach(z => z.classList.remove('drag-over'));
  touchCard      = null;
  touchDragging = false;
  lastTargetZone = null;
});

// ─────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────
function clearAll() {
  if (!confirm('¿Eliminar todos los personajes y limpiar el tier list?')) return;
  document.querySelectorAll('.char-card').forEach(c => c.remove());
  poolEmpty.style.display = '';
}

function exportImage() {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  script.onload = () => {
    html2canvas(document.getElementById('tierContainer'), {
      backgroundColor: '#0A0A0F',
      scale: 2,
      useCORS: true,
      logging: false
    }).then(canvas => {
      const a = document.createElement('a');
      a.download = 'tierlist.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  };
  script.onerror = () => alert('No se pudo exportar. Toma una captura de pantalla.');
  document.head.appendChild(script);
}
</script>
</body>
</html>
